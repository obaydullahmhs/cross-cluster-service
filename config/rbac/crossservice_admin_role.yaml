# This rule is not used by the project cross-cluster-service itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over net.obaydullah.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cross-cluster-service
    app.kubernetes.io/managed-by: kustomize
  name: crossservice-admin-role
rules:
- apiGroups:
  - net.obaydullah.dev
  resources:
  - crossservices
  verbs:
  - '*'
- apiGroups:
  - net.obaydullah.dev
  resources:
  - crossservices/status
  verbs:
  - get
