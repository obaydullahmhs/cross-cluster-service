# This rule is not used by the project cross-cluster-service itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to net.obaydullah.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cross-cluster-service
    app.kubernetes.io/managed-by: kustomize
  name: crossservice-viewer-role
rules:
- apiGroups:
  - net.obaydullah.dev
  resources:
  - crossservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - net.obaydullah.dev
  resources:
  - crossservices/status
  verbs:
  - get
