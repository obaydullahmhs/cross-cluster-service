# Binds the namespaced Role that grants read access to credential Secrets.
#
# This is deliberately a RoleBinding rather than a ClusterRoleBinding: the
# controller must be able to read Secrets in its own namespace and nowhere else,
# because a cluster-scoped RemoteCluster naming a Secret in any namespace would
# be a credential-exfiltration primitive.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: cross-cluster-service
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
